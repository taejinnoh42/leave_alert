name: Leave Auto Checker

on:
  schedule:
    - cron: '*/10 * * * *' # 매 10분마다 실행
  workflow_dispatch: # 수동 실행 버튼 추가 (테스트용)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 봇이 파일을 덮어쓰고 저장할 수 있도록 쓰기 권한 부여

    steps:
    - name: 저장소 가져오기
      uses: actions/checkout@v4

    - name: 파이썬 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 라이브러리 및 브라우저 설치
      run: |
        python -m pip install --upgrade pip
        pip install requests playwright
        # 깃허브 서버(우분투) 환경에 맞는 크롬 브라우저와 필수 의존성 파일 설치
        playwright install --with-deps chromium

    - name: 파이썬 스크립트 실행
      run: python code_v2.py

    - name: 변경된 상태 파일(JSON) 깃허브에 덮어쓰기
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add leave_state.json
        # 파일 내용에 변화가 있을 때만 Commit 및 Push 수행
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update leave_state.json" && git push)
